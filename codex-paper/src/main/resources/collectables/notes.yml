enabled: true
namespace: "notes"
display_name: "<gold>Ancient Notes"
plain_display_name: "Ancient Notes"
icon:
  material: BOOK
  displayName: "<gold>Notes"
  lore:
    - "<gray>Discover scattered pages"
    - "<gray>hidden throughout the world."
  glint: true
selected_icon:
  material: WRITABLE_BOOK
  displayName: "<green>Selected Notes"
  lore:
    - "<yellow>Currently viewing notes"
show_when_locked: true

# Sent the first time a player discovers any entry in this repository.
# An entry may override it with its own 'playerMessageOnDiscover'.
player_message_on_discover: "<gray>You discovered <reset>{collectable_name_formatted}<gray>!"
# Uncomment to announce discoveries to the whole server:
# global_message_on_discover: "<gray>{player} discovered <reset>{collectable_name_formatted}<gray>!"

entries:
  example_note:
    type: "NOTE"
    displayName: "<white>Example Note"
    plainDisplayName: "Example Note"
    showWhenLocked: true
    allowReplay: false
    unlockedIcon:
      material: PAPER
      displayName: "<white>Example Note (Unlocked)"
      lore:
        - "<gray>An old, fragile piece of parchment."
      glint: true
    lockedIcon:
      material: MAP
      displayName: "<dark_gray>???"
    commandsOnMenuLeftClick:
      enabled: true
      commands:
        - runAs: PLAYER
          command: "say I left-clicked the parchment"
    commandsOnMenuRightClick:
      enabled: true
      commands:
        - runAs: PLAYER
          command: "say I right-clicked the parchment"